<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nộp bài – Thông tin tác phẩm – mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F1F8FB;color:#1E3A5F}
h1,h2,h3,.serif{font-family:'Lora',Georgia,serif;font-weight:700}
a{color:#075BA8}a:hover{color:#05447E}
*{box-sizing:border-box}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#1E3A5F}
.fld input,.fld textarea,.fld select{min-height:48px;border:1.5px solid #CAE5F6;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:16px;font-weight:400;color:#1E3A5F;background:#FFFFFF;width:100%;line-height:1.55}
.hint{font-size:12px;font-weight:400;color:#4A6584;line-height:1.5}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 100%; background: #F1F8FB; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1E3A5F">

<!-- HEADER MOBILE -->
<header style="background: #FFFFFF; border-bottom: 1px solid #CAE5F6">
  <div style="padding: 10px 16px; display: flex; align-items: center; gap: 10px">
    <a href="MainMobile.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; min-width: 0; flex: 1 1 auto">
      <img src="assets/img/logo-gdtd.png" alt="Báo Giáo dục và Thời đại" style="height: 30px; width: auto; display: block; flex: 0 0 auto">
      <span aria-hidden="true" style="width: 1px; height: 24px; background: #CAE5F6; flex: 0 0 auto"></span>
      <span class="serif" style="font-size: 15px; font-weight: 700; color: #075BA8; line-height: 1.2">Chọn nghề, Chọn tương lai</span>
    </a>
    <span style="font-size: 12px; color: #4A6584; flex: 0 0 auto">Hồ sơ · <strong style="color: #075BA8">Bản nháp</strong></span>
  </div>
</header>

<!-- STEPPER GỌN -->
<nav aria-label="Các bước nộp bài" style="background: #FFFFFF; border-bottom: 1px solid #CAE5F6; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <ol style="list-style: none; margin: 0; padding: 0; display: flex; gap: 6px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
      <li aria-current="{{s.aria}}" aria-label="Bước {{s.n}}: {{s.t}}" style="flex: 1; height: 6px; border-radius: 3px; background: {{s.bar}}"></li>
    </sc-for>
  </ol>
  <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #075BA8">BƯỚC 3 / 5</span>
    <span style="font-size: 12px; color: #4A6584">Tiếp theo: Tải video</span>
  </div>
</nav>

<section style="padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.25; color: #075BA8">Thông tin tác phẩm</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4A6584">Tên video và phần giới thiệu sẽ được công khai nếu bài vào Top 30.</p>
  </div>

  <!-- TÊN + GIỚI THIỆU -->
  <div style="background: #FFFFFF; border: 1px solid #CAE5F6; border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px">
    <label class="fld">Tên video *
      <input type="text" maxlength="120" value="[Tên video dự thi]">
    </label>
    <label class="fld"><span>Nghề hoặc nhóm nghề video nói đến <span style="font-weight: 400; color: #4A6584">(khuyến khích)</span></span>
      <input type="text" value="[Ví dụ: Lập trình viên phần mềm]">
    </label>
    <label class="fld">
      <span style="display: flex; justify-content: space-between; gap: 12px"><span>Giới thiệu tác phẩm *</span><span style="font-weight: 700; color: {{countColor}}; flex: 0 0 auto">{{countText}}</span></span>
      <textarea rows="8" value="{{intro}}" onChange="{{onIntro}}" style="border-color: {{introBorder}}"></textarea>
      <span class="hint">Tối đa 150 từ. Nêu lý do chọn nghề, câu chuyện chính và điều video muốn truyền tải.</span>
    </label>
    <sc-if value="{{over}}" hint-placeholder-val="{{false}}">
      <div role="alert" style="background: #FEF3F2; border: 1.5px solid #FDA29B; border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #B42318; font-weight: 600">Phần giới thiệu vượt quá 150 từ. Hãy rút gọn để tiếp tục.</div>
    </sc-if>
  </div>

  <!-- NGÔN NGỮ -->
  <div style="background: #FFFFFF; border: 1px solid #CAE5F6; border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 18px; color: #075BA8">Ngôn ngữ trong video *</h2>
    <div role="radiogroup" aria-label="Ngôn ngữ trong video" style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{l.pressed}}" onClick="{{l.pick}}" style="min-height: 48px; padding: 0 16px; border-radius: 12px; border: {{l.border}}; background: {{l.bg}}; color: {{l.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left">{{l.t}}</button>
      </sc-for>
    </div>
    <sc-if value="{{needSub}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 12px; background: #F1F8FB; border: 1.5px solid #6CB9F7; border-radius: 12px; padding: 14px">
        <label class="fld">Ngôn ngữ cụ thể *<input type="text" placeholder="Ví dụ: tiếng H’Mông, tiếng Anh"></label>
        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; cursor: pointer">
          <input type="checkbox" style="width: 22px; height: 22px; margin-top: 1px; accent-color: #075BA8; flex: 0 0 auto">
          <span><strong>Video có phụ đề tiếng Việt chính xác</strong> (bắt buộc với video dùng tiếng dân tộc thiểu số hoặc ngoại ngữ).</span>
        </label>
      </div>
    </sc-if>
    <sc-if value="{{isVi}}" hint-placeholder-val="{{true}}">
      <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; cursor: pointer">
        <input type="checkbox" checked="checked" style="width: 22px; height: 22px; margin-top: 1px; accent-color: #075BA8; flex: 0 0 auto">
        <span>Video có phụ đề tiếng Việt <span style="color: #4A6584">(khuyến khích, giúp người xem dễ tiếp cận)</span></span>
      </label>
    </sc-if>
  </div>

  <!-- KHAI BÁO AI -->
  <div style="background: #FFFFFF; border: 1px solid #CAE5F6; border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 18px; color: #075BA8">Khai báo sử dụng trí tuệ nhân tạo (AI) *</h2>
    <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #4A6584">Được dùng AI để hỗ trợ kỹ thuật hoặc minh họa, nhưng phải khai báo. Không dùng AI để giả mạo người thật, tiếng nói, sự kiện hoặc số liệu.</p>
    <div role="radiogroup" aria-label="Có sử dụng AI không" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{aiOpts}}" as="o" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{o.pressed}}" onClick="{{o.pick}}" style="min-height: 52px; padding: 0 8px; border-radius: 12px; border: {{o.border}}; background: {{o.bg}}; color: #075BA8; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{o.t}}</button>
      </sc-for>
    </div>
    <sc-if value="{{aiYes}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 12px; background: #F1F8FB; border: 1.5px solid #6CB9F7; border-radius: 12px; padding: 14px">
        <label class="fld">Mô tả công cụ và phần đã dùng AI *
          <textarea rows="4" placeholder="Ví dụ: dùng [tên công cụ] tạo phụ đề tự động, sau đó tự kiểm tra và sửa lại."></textarea>
        </label>
      </div>
    </sc-if>
  </div>

  <!-- NGUỒN SỐ LIỆU -->
  <div style="background: #FFFFFF; border: 1px solid #CAE5F6; border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px">
    <label class="fld">Nguồn số liệu, nhận định chuyên môn dùng trong video <span style="font-weight: 400; color: #4A6584">(nếu có)</span>
      <textarea rows="4" placeholder="Ví dụ: Mức lương khởi điểm theo báo cáo của [Trung tâm dịch vụ việc làm tỉnh], năm 2025."></textarea>
      <span class="hint">Thông tin về nhu cầu nhân lực, thu nhập, cơ hội việc làm phải có căn cứ và ghi rõ nguồn.</span>
    </label>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
    <sc-if value="{{notOver}}" hint-placeholder-val="{{true}}">
      <a href="NopBai4Mobile.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: #075BA8; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none">Tiếp tục: Tải video<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCEB87" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    </sc-if>
    <sc-if value="{{over}}" hint-placeholder-val="{{false}}">
      <button type="button" disabled="disabled" style="min-height: 48px; border-radius: 12px; border: 0; background: #CAE5F6; color: #4A6584; font-family: inherit; font-weight: 700; font-size: 15px">Tiếp tục: Tải video</button>
    </sc-if>
    <a href="NopBaiMobile.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1.5px solid #075BA8; color: #075BA8; font-weight: 700; font-size: 15px; text-decoration: none">Quay lại</a>
    
  </div>
</section>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      intro: 'Em sinh ra ở một xã vùng cao, nơi nhiều bạn cùng tuổi nghỉ học sớm để đi làm thuê. Em chọn học lập trình tại trường cao đẳng nghề vì muốn làm ra những ứng dụng giúp bà con bán nông sản trên mạng. Video kể lại hành trình hai năm học nghề, những lần thực tập tại doanh nghiệp và dự án nhỏ em đang làm cùng hợp tác xã ở quê.',
      lang: 'vi',
      ai: 'yes'
    };
  }
  renderVals() {
    const st = this.state;
    const words = st.intro.trim() ? st.intro.trim().split(/\s+/).length : 0;
    const over = words > 150;
    const names = ['Hình thức & hạng mục', 'Người dự thi', 'Thông tin tác phẩm', 'Tải video', 'Xem lại & cam kết'];
    const cur = 2;
    const steps = names.map((t, i) => ({ n: String(i + 1), t, aria: i === cur ? 'step' : 'false', bar: i < cur ? '#075BA8' : (i === cur ? '#FF9A52' : '#CAE5F6') }));
    const pill = (on) => ({ pressed: on ? 'true' : 'false', border: on ? '2px solid #075BA8' : '1.5px solid #9FD1F6', bg: on ? '#075BA8' : '#FFFFFF', fg: on ? '#FFFFFF' : '#075BA8' });
    const langs = [{ id: 'vi', t: 'Tiếng Việt' }, { id: 'dt', t: 'Tiếng dân tộc thiểu số' }, { id: 'nn', t: 'Ngoại ngữ' }].map((l) => ({ ...l, ...pill(st.lang === l.id), pick: () => this.setState({ lang: l.id }) }));
    const aiOpts = [{ id: 'no', t: 'Không sử dụng AI' }, { id: 'yes', t: 'Có sử dụng AI' }].map((o) => ({ ...o, pressed: st.ai === o.id ? 'true' : 'false', border: st.ai === o.id ? '2px solid #075BA8' : '1.5px solid #CAE5F6', bg: st.ai === o.id ? '#CAE5F6' : '#FFFFFF', pick: () => this.setState({ ai: o.id }) }));
    return {
      steps, langs, aiOpts,
      intro: st.intro,
      onIntro: (e) => this.setState({ intro: e.target.value }),
      countText: words + ' / 150 từ',
      countColor: over ? '#B42318' : '#075BA8',
      introBorder: over ? '#B42318' : '#CAE5F6',
      over, notOver: !over,
      needSub: st.lang !== 'vi', isVi: st.lang === 'vi',
      aiYes: st.ai === 'yes'
    };
  }
}
</script>
<script src="assets/dc-lite.js"></script>
</body>
</html>
