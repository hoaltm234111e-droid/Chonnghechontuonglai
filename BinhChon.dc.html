<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bình chọn Top 30</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F1F8FB;color:#1E3A5F}
h1,h2,h3,.serif{font-family:'Lora',Georgia,serif;font-weight:700}
a{color:#075BA8}a:hover{color:#05447E}
*{box-sizing:border-box}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 100%; background: #F1F8FB; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1E3A5F">

<!-- HEADER -->
<header style="background: #FFFFFF; border-bottom: 1px solid #CAE5F6">
  <div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; flex: 0 0 auto">
      <img src="assets/img/logo-gdtd.png" alt="Báo Giáo dục và Thời đại" style="height: 44px; width: auto; display: block">
      <span aria-hidden="true" style="width: 1px; height: 36px; background: #CAE5F6"></span>
      <span style="display: flex; flex-direction: column; line-height: 1.15">
        <span class="serif" style="font-size: 19px; font-weight: 700; color: #075BA8">Chọn nghề, Chọn tương lai</span>
      </span>
    </a>
    <nav aria-label="Điều hướng chính" style="display: flex; flex-wrap: wrap; gap: 4px 22px; flex: 1 1 420px; justify-content: center"><a href="Main.dc.html" style="font-size: 15px; font-weight: 500; color: rgb(30, 58, 95); text-decoration: none; padding: 8px 0px">Trang chủ</a>
      <a href="#" style="font-size: 15px; font-weight: 500; color: rgb(30, 58, 95); text-decoration: none; padding: 8px 0px">Thể lệ</a>
      <a href="#" style="font-size: 15px; font-weight: 700; color: rgb(7, 91, 168); text-decoration: none; padding: 8px 0px; border-bottom: 3px solid rgb(252, 235, 135)">Video dự thi</a>
      <a href="#" style="font-size: 15px; font-weight: 500; color: rgb(30, 58, 95); text-decoration: none; padding: 8px 0px">Bài dự thi của tôi</a>
      <a href="#" style="font-size: 15px; font-weight: 500; color: rgb(30, 58, 95); text-decoration: none; padding: 8px 0px">Thông báo</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px; flex: 0 0 auto">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #CAE5F6; color: #075BA8; font-weight: 800; display: flex; align-items: center; justify-content: center">A</span>
      <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 14px; font-weight: 700">[Tên người dùng]</span><span style="font-size: 12px; color: #4A6584">Đã xác thực</span></span>
    </div>
  </div>
</header>

<!-- PHASE STRIP -->
<div style="background: #FCEB87">
  
</div>

<!-- TITLE -->
<section style="position: relative; overflow: hidden; background: #CAE5F6">
  <div aria-hidden="true" style="position: absolute; right: -120px; top: -160px; width: 420px; height: 420px; border-radius: 50%; background: #9FD1F6"></div>
  <div style="position: relative; max-width: 1240px; margin: 0 auto; padding: 44px 24px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #075BA8">VIDEO DỰ THI · TOP 30</span>
    <h1 style="margin: 0; font-size: clamp(40px, 4.5vw, 56px); font-weight: 700; color: #075BA8; line-height: 1.1">Bình chọn Video được yêu thích nhất</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1E3A5F; max-width: 720px">30 video được Ban Giám khảo chọn từ vòng sơ khảo. Kết quả bình chọn chỉ dùng để trao giải Video được yêu thích nhất, không quy đổi thành điểm và không ảnh hưởng đến giải Nhất, Nhì, Ba.</p>
  </div>
</section>

<!-- BODY -->
<section style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

  <!-- MAIN -->
  <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
    <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
      
    </sc-if>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
      <div role="tablist" aria-label="Lọc theo hạng mục" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
          <sc-if value="{{t.active}}" hint-placeholder-val="{{false}}">
            <button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #075BA8; background: #075BA8; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{t.label}}</button>
          </sc-if>
          <sc-if value="{{t.inactive}}" hint-placeholder-val="{{true}}">
            <button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #9FD1F6; background: #FFFFFF; color: #075BA8; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button>
          </sc-if>
        </sc-for>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1.5px solid #CAE5F6; border-radius: 12px; padding: 0 14px; min-height: 44px; flex: 0 1 280px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A6584" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm video</span>
        <input type="search" placeholder="Tìm theo mã bài, tên video, cơ sở" style="border: 0; outline: none; background: transparent; font-family: inherit; font-size: 14px; width: 100%; color: #1E3A5F">
      </label>
    </div>

    

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px">
      <sc-for list="{{videos}}" as="v" hint-placeholder-count="9">
        <article style="background: #FFFFFF; border: 1px solid #CAE5F6; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
          <button type="button" onClick="{{v.open}}" aria-label="Xem video {{v.code}}" style="position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; background: {{v.thumb}}; border: 0; padding: 0; cursor: pointer">
            <img src="{{v.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
            <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
              <span style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#075BA8" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
            </span>
            <span style="position: absolute; left: 10px; top: 10px; background: #075BA8; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px">{{v.code}}</span>
            <span style="position: absolute; right: 10px; bottom: 10px; background: rgba(7, 91, 168, 0.88); color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 6px">{{v.dur}}</span>
          </button>
          <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1">
            <span style="align-self: flex-start; background: #F1F8FB; color: #075BA8; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px">{{v.cat}}</span>
            <h3 onClick="{{v.open}}" style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.35; color: #1E3A5F; cursor: pointer">{{v.title}}</h3>
            <span style="font-size: 13px; line-height: 1.45; color: #4A6584"><strong style="color: #1E3A5F; font-weight: 600">{{v.author}}</strong> · {{v.school}}, {{v.province}}</span>
            <div style="margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
              <sc-if value="{{showVotes}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 13px; font-weight: 600; color: #075BA8">{{v.votesText}} lượt</span>
              </sc-if>
              <sc-if value="{{v.first}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{v.vote}}" style="margin-left: auto; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border-radius: 10px; border: 0; background: {{wDeep}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #075BA8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>Bình chọn</button>
            </sc-if>
            <sc-if value="{{v.more}}" hint-placeholder-val="{{false}}">
              <span style="margin-left: auto; display: inline-flex; gap: 8px; align-items: center">
                <span title="Lượt bạn đã dành cho video này" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 10px; background: #CAE5F6; color: #075BA8; font-size: 13px; font-weight: 800"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#075BA8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Đã chọn {{v.mine}}</span>
                <button type="button" onClick="{{v.vote}}" aria-label="Bình chọn thêm 1 lượt cho {{v.code}}" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 10px; border: 0; background: {{wDeep}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #075BA8"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Thêm</button>
              </span>
            </sc-if>
            <sc-if value="{{v.done}}" hint-placeholder-val="{{false}}">
              <span style="margin-left: auto; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border-radius: 10px; background: #075BA8; color: #FFFFFF; font-size: 13px; font-weight: 800"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FCEB87" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Đã bình chọn · {{v.mine}}</span>
            </sc-if>
            <sc-if value="{{v.outOfVotes}}" hint-placeholder-val="{{false}}">
              <button type="button" disabled="disabled" style="margin-left: auto; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #CAE5F6; background: #F1F8FB; color: #4A6584; font-family: inherit; font-size: 13px; font-weight: 600">Hết lượt bình chọn</button>
            </sc-if>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
    <sc-if value="{{hasPages}}" hint-placeholder-val="{{true}}">
      <nav aria-label="Phân trang video" style="display: flex; justify-content: center; gap: 8px; margin-top: 8px">
        <button type="button" onClick="{{prevPage}}" aria-label="Trang trước" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #CAE5F6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{prevOp}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#075BA8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
        <sc-for list="{{pageBtns}}" as="pg" hint-placeholder-count="2">
          <sc-if value="{{pg.on}}" hint-placeholder-val="{{false}}"><button type="button" aria-current="page" onClick="{{pg.go}}" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #075BA8; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">{{pg.n}}</button></sc-if>
          <sc-if value="{{pg.off}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{pg.go}}" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #CAE5F6; background: #FFFFFF; color: #075BA8; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{pg.n}}</button></sc-if>
        </sc-for>
        <button type="button" onClick="{{nextPage}}" aria-label="Trang sau" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #CAE5F6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{nextOp}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#075BA8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
      </nav>
    </sc-if>
  </div>

  <!-- SIDEBAR -->
  <aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #075BA8; color: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #CAE5F6">LƯỢT BÌNH CHỌN</span>
      <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 48px; font-weight: 800; line-height: 1; color: {{wLight}}">{{remaining}}</span><span style="font-size: 18px; font-weight: 600">/ 5 lượt còn lại</span></div>
      <div style="display: flex; gap: 6px" aria-hidden="true">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
          <span style="flex: 1; height: 8px; border-radius: 4px; background: {{d.c}}"></span>
        </sc-for>
      </div>
      
      
    </div>

    <div style="background: #FFFFFF; border: 1px solid #CAE5F6; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 21px; font-weight: 700; color: #075BA8">Quy chế bình chọn</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
        <li style="display: flex; gap: 10px; font-size: 14px; line-height: 1.5"><span style="width: 8px; height: 8px; border-radius: 50%; background: rgb(48, 159, 249); margin-top: 7px; flex: 0 0 auto"></span>Mỗi tài khoản tối đa 05 lượt bình chọn, có thể bình chọn hết 5 lượt cho 1 video hoặc cho bình chọn cho các video khác nhau.</li>
        <li style="display: flex; gap: 10px; font-size: 14px; line-height: 1.5"><span style="width: 8px; height: 8px; border-radius: 50%; background: #309FF9; margin-top: 7px; flex: 0 0 auto"></span>Phải đăng nhập và hoàn tất bước xác thực của hệ thống.</li>
        <li style="display: flex; gap: 10px; font-size: 14px; line-height: 1.5"><span style="width: 8px; height: 8px; border-radius: 50%; background: #309FF9; margin-top: 7px; flex: 0 0 auto"></span>Chỉ lượt hợp lệ sau đối soát được ghi nhận. Lượt tự động, tài khoản ảo, mua bán phiếu sẽ bị hủy; bài có thể bị loại.</li>
        <li style="display: flex; gap: 10px; font-size: 14px; line-height: 1.5"><span style="width: 8px; height: 8px; border-radius: 50%; background: #309FF9; margin-top: 7px; flex: 0 0 auto"></span>Bằng phiếu: ưu tiên điểm sơ khảo cao hơn, sau đó bài nộp sớm hơn.</li>
      </ul>
      
    </div>

    
  </aside>
</section>


<!-- POPUP XEM VIDEO -->
<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
  <div onClick="{{backdrop}}" style="position: fixed; inset: 0; z-index: 50; background: rgba(11, 42, 74, 0.72); overflow-y: auto; padding: 32px 16px">
    <div role="dialog" aria-modal="true" aria-labelledby="vd-title" style="max-width: 920px; margin: 0 auto; background: #FFFFFF; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35)">

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px 14px 24px; border-bottom: 1px solid #CAE5F6">
        <span style="background: #075BA8; color: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 6px">{{sel.code}}</span>
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #4A6584">{{sel.catUpper}}</span>
        <button type="button" onClick="{{close}}" aria-label="Đóng" style="margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #F1F8FB; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#075BA8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>

      <div style="background: #0B2A4A">
        <div style="position: relative; aspect-ratio: 16 / 9">
          <img src="{{sel.img}}" alt="Khung hình video {{sel.code}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
          <sc-if value="{{paused}}" hint-placeholder-val="{{true}}">
            <span aria-hidden="true" style="position: absolute; inset: 0; background: rgba(11, 42, 74, 0.25)"></span>
            <button type="button" onClick="{{togglePlay}}" aria-label="Phát video" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="#075BA8" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
            </button>
          </sc-if>
          <sc-if value="{{subOn}}" hint-placeholder-val="{{true}}">
            <span style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: 80%; background: rgba(11, 42, 74, 0.82); color: #FFFFFF; font-size: 15px; line-height: 1.45; padding: 6px 12px; border-radius: 6px; text-align: center">{{sel.sub}}</span>
          </sc-if>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px">
          <button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></sc-if>
            <sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
          </button>
          <span style="font-size: 13px; font-weight: 600; color: #FFFFFF; min-width: 92px">{{timeText}}</span>
          <span aria-hidden="true" style="flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.22); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{progress}}; border-radius: 3px; background: #FF9A52"></span></span>
          <button type="button" onClick="{{toggleSub}}" aria-pressed="{{subPressed}}" aria-label="Phụ đề" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer"><span style="border: 1.5px solid {{subColor}}; color: {{subColor}}; border-radius: 4px; padding: 1px 4px; font-size: 12px; font-weight: 800; font-family: inherit">CC</span></button>
          <button type="button" aria-label="Toàn màn hình" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
        </div>
      </div>

      <div style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 id="vd-title" style="margin: 0; font-size: 30px; line-height: 1.2; color: #075BA8">{{sel.title}}</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 15px">
          <span><strong>{{sel.author}}</strong></span>
          <span style="color: #4A6584">{{sel.school}} · {{sel.province}}</span>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 16px 0; border-top: 1px solid #CAE5F6; border-bottom: 1px solid #CAE5F6">
          <sc-if value="{{sel.first}}" hint-placeholder-val="{{true}}">

    });
    const voted = this.state.voted || {};
    // Mỗi tài khoản tối đa 05 lượt; được dồn nhiều lượt cho 1 video hoặc chia cho tối đa 05 video (mô tả kỹ thuật mục 8)
    const used = Object.values(voted).reduce((a, b) => a + b, 0);
    const remaining = Math.max(0, 5 - used);
    const list = this.state.tab === 'all' ? all : all.filter((v) => v.catId === this.state.tab);
    const PER = this.props.perPage ?? 15;
    const pages = Math.max(1, Math.ceil(list.length / PER));
    const page = Math.min(this.state.page || 1, pages);
    const allMk = list.map((v) => {
      const mine = voted[v.code] || 0;
      return {
        ...v,
        mine: String(mine),
        first: mine === 0 && remaining > 0,
        more: mine > 0 && remaining > 0,
        done: mine > 0 && remaining <= 0,
        outOfVotes: mine === 0 && remaining <= 0,
        vote: () => {
          if (remaining <= 0) return;
          this.setState({ voted: { ...voted, [v.code]: mine + 1 }, last: v.code });
        },
        open: () => this.setState({ open: v.code, playing: false, copied: false })
      };
    });
    const videos = allMk.slice((page - 1) * PER, page * PER);
    const pageBtns = Array.from({ length: pages }, (_, i) => ({ n: String(i + 1), on: i + 1 === page, off: i + 1 !== page, go: () => this.setState({ page: i + 1 }) }));
    const pageVals = {
      pageBtns, hasPages: pages > 1,
      prevPage: () => this.setState({ page: Math.max(1, page - 1) }), nextPage: () => this.setState({ page: Math.min(pages, page + 1) }),
      prevOp: page === 1 ? '0.4' : '1', nextOp: page === pages ? '0.4' : '1'
    };
    const tabDefs = [{ id: 'all', label: 'Tất cả (30)' }].concat(cats.map((c) => ({ id: c.id, label: c.short + ' (10)' })));
    const tabs = tabDefs.map((t) => ({
      label: t.label,
      active: this.state.tab === t.id,
      inactive: this.state.tab !== t.id,
      pick: () => this.setState({ tab: t.id, page: 1 })
    }));
    const dots = [0, 1, 2, 3, 4].map((i) => ({ c: i < remaining ? warm.light : 'rgba(255,255,255,0.22)' }));
    const st = this.state;
    const openCode = st.open || ((this.props.previewPopup ?? false) ? videos.at(1).code : null);
    const selIdx = openCode ? allMk.findIndex((v) => v.code === openCode) : -1;
    const selRaw = selIdx >= 0 ? allMk.at(selIdx) : null;
    const sel = selRaw ? { ...selRaw, catUpper: ({ cn: 'HẠNG MỤC 01 · CÔNG NGHỆ SỐ VÀ SÁNG TẠO SỐ', kt: 'HẠNG MỤC 02 · KỸ THUẬT, CÔNG NGHỆ VÀ SẢN XUẤT XANH – THÔNG MINH', dv: 'HẠNG MỤC 03 · DỊCH VỤ HIỆN ĐẠI VÀ CHĂM SÓC CON NGƯỜI' })[selRaw.catId] } : {};
    const n = allMk.length;
    const prevV = selIdx >= 0 ? allMk.at((selIdx - 1 + n) % n) : null;
    const nextV = selIdx >= 0 ? allMk.at((selIdx + 1) % n) : null;
    const pos = st.playing ? 24 : 0;
    return {
      hasSel: !!selRaw,
      sel,
      close: () => this.setState({ open: null, playing: false }),
      backdrop: (e) => { if (e.target === e.currentTarget) this.setState({ open: null, playing: false }); },
      prevCode: prevV ? prevV.code + ' · ' + prevV.title : '',
      nextCode: nextV ? nextV.code + ' · ' + nextV.title : '',
      goPrev: () => prevV && this.setState({ open: prevV.code, playing: false }),
      goNext: () => nextV && this.setState({ open: nextV.code, playing: false }),
      paused: !st.playing, playing: st.playing,
      playLabel: st.playing ? 'Tạm dừng' : 'Phát video',
      togglePlay: () => this.setState({ playing: !st.playing, open: openCode }),
      timeText: '0:' + String(pos).padStart(2, '0') + ' / ' + (selRaw ? selRaw.dur.replace(/^0/, '') : ''),
      progress: Math.round(pos / 88 * 100) + '%',
      subOn: st.sub, subPressed: st.sub ? 'true' : 'false', subColor: st.sub ? '#FCEB87' : '#FFFFFF',
      toggleSub: () => this.setState({ sub: !st.sub, open: openCode }),
      copyLabel: st.copied ? 'Đã sao chép' : 'Sao chép liên kết',
      copy: () => this.setState({ copied: true, open: openCode }),
      tabs,
      videos,
      remaining: String(remaining),
      dots,
      wDeep: warm.deep,
      wLight: warm.light,
      showVotes: !!(this.props.showVotes ?? false),
      countText: 'Hiển thị ' + ((page - 1) * PER + 1) + '–' + ((page - 1) * PER + videos.length) + ' / ' + list.length + ' video',
      ...pageVals,
      toast: !!this.state.last,
      toastText: this.state.last ? 'Đã ghi nhận 1 lượt cho ' + this.state.last + ' (bạn đã dành ' + (voted[this.state.last] || 0) + ' lượt cho video này). Bạn còn ' + remaining + '/5 lượt.' : ''
    };
  }
}
</script>
